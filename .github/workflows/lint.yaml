name: Helm CI

on:
  pull_request:
    paths:
      - "charts/**"

permissions: read-all

jobs:
  helm-ci:
    uses: trowaflo/github-actions/.github/workflows/ci-helm.yml@c62d1b93d63953495704ff3c980b0ec8414e54f9 # v4.0.1
    permissions:
      contents: write
      pull-requests: write
    with:
      harden_runner_egress_policy: audit
      enable_lint: true
      enable_bump: true
