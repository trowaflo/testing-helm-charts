name: Helm CI

on:
  pull_request:
    paths:
      - "charts/**"

permissions: read-all

jobs:
  helm-ci:
    uses: trowaflo/github-actions/.github/workflows/ci-helm.yml@8358d28b9b77208a15f1fa3536c03baca0d21650 # v2.1.0
    permissions:
      contents: write
      pull-requests: write
    with:
      harden_runner_egress_policy: audit
      enable_lint: true
      enable_bump: true
