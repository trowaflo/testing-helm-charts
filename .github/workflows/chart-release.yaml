name: Release Charts

on:
  push:
    branches:
      - main

permissions: read-all

jobs:
  release:
    uses: trowaflo/github-actions/.github/workflows/release-helm.yml@c62d1b93d63953495704ff3c980b0ec8414e54f9 # v4.0.1
    permissions:
      contents: write
      pages: write
    with:
      harden_runner_egress_policy: audit
      enable_release: true
      release_charts_dirs: "charts/library charts/apps"
