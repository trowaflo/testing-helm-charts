name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  security:
    uses: trowaflo/github-actions/.github/workflows/security.yml@c62d1b93d63953495704ff3c980b0ec8414e54f9 # v4.0.1
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    with:
      harden_runner_egress_policy: audit

  lint:
    uses: trowaflo/github-actions/.github/workflows/lint.yml@c62d1b93d63953495704ff3c980b0ec8414e54f9 # v4.0.1
    permissions:
      contents: read
      security-events: write
    with:
      harden_runner_egress_policy: audit
      enable_yamllint: true
