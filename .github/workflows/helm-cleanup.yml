name: Helm PR Cleanup

on:
  pull_request:
    types: [closed]

permissions: read-all

jobs:
  cleanup:
    uses: trowaflo/github-actions/.github/workflows/ci-helm-cleanup.yml@c62d1b93d63953495704ff3c980b0ec8414e54f9 # v4.0.1
    permissions:
      contents: write
      pull-requests: write
    with:
      harden_runner_egress_policy: audit
